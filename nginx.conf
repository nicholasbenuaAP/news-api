log_format lb '$remote_addr [$time_local] "$request" $status '
              'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';

upstream app_backend {
    least_conn;
    server app1:3000;
    server app2:3000;
}

server {
    listen 80;
    server_name _;
    return 301 https://beritakalbar-nicholas.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name beritakalbar-nicholas.duckdns.org;

    access_log /var/log/nginx/access.log lb;

    ssl_certificate     /etc/letsencrypt/live/beritakalbar-nicholas.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beritakalbar-nicholas.duckdns.org/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://app_backend/health;
    }
}
